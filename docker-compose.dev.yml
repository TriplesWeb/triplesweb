# Pi 개발 서버: MariaDB 인스턴스만 공유, DB/업로드/데이터는 독립. 케미 정적 자산만 읽기 전용 공유.
# 네트워크 이름: 운영 스택(`/opt/stacks/triplesweb`)의 `docker network ls`로 확인.
#   보통 `triplesweb_triples` — .env의 COMPOSE_NETWORK로 덮어쓸 수 있다.
services:
  app:
    image: ${IMAGE:-ghcr.io/triplesweb/triplesweb:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8091}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mariadb://${MYSQL_HOST:-mariadb}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-triples}?useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      COSMO_ACCESS_TOKEN: ${COSMO_ACCESS_TOKEN:-}
      COSMO_REFRESH_TOKEN: ${COSMO_REFRESH_TOKEN:-}
      COSMO_KEY: ${COSMO_KEY:-}
      COSMO_CREDENTIALS_FILE: /app/data/cosmo/credentials.json
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CHEMISTRY_ADMIN_PASSWORD: ${CHEMISTRY_ADMIN_PASSWORD:-}
      FILE_UPLOAD_DIR: /app/uploads
      MEDIA_CATALOG_PATH: /app/data/videos.json
      UPLOAD_SYNC_ENABLED: "false"
      UPLOAD_FALLBACK_BASE_URL: ""
    volumes:
      - ${UPLOADS_DIR:-/opt/stacks/triplesweb-dev/uploads}:/app/uploads
      - ${DATA_DIR:-/opt/stacks/triplesweb-dev/data}:/app/data
      - ${PROD_CHEMISTRY_DIR:-/opt/stacks/triplesweb/uploads/chemistry}:/app/uploads/chemistry:ro
    networks:
      - triples_shared

networks:
  triples_shared:
    external: true
    name: ${COMPOSE_NETWORK:-triplesweb_triples}
