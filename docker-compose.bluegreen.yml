# Blue-Green overlay. Keep the existing docker-compose.yml for legacy rollback.
# Only explicitly selected services are started by scripts/deploy-pi-bluegreen.sh.
x-bg-app: &bg-app
  restart: unless-stopped
  mem_limit: ${BG_SLOT_MEMORY_LIMIT:-1800m}
  networks:
    - triples
  environment:
    SERVER_PORT: "8080"
    SPRING_DATASOURCE_URL: jdbc:mariadb://${MYSQL_HOST:-mariadb}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-triples}?useSSL=false
    SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
    SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    # Never let a staging application alter the live schema through Hibernate.
    SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
    COSMO_ACCESS_TOKEN: ${COSMO_ACCESS_TOKEN:-}
    COSMO_REFRESH_TOKEN: ${COSMO_REFRESH_TOKEN:-}
    COSMO_KEY: ${COSMO_KEY:-}
    COSMO_CREDENTIALS_FILE: /app/data/cosmo/credentials.json
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    CHEMISTRY_ADMIN_PASSWORD: ${CHEMISTRY_ADMIN_PASSWORD:-}
    FILE_UPLOAD_DIR: /app/uploads
    MEDIA_CATALOG_PATH: /app/data/videos.json
    UPLOAD_SYNC_ENABLED: "false"
    UPLOAD_FALLBACK_BASE_URL: ""
  volumes:
    - ./uploads:/app/uploads
    - ./data:/app/data

services:
  app_blue:
    <<: *bg-app
    profiles: [bluegreen]
    image: ${BG_BLUE_IMAGE:-ghcr.io/triplesweb/triplesweb:latest}
  app_green:
    <<: *bg-app
    profiles: [bluegreen]
    image: ${BG_GREEN_IMAGE:-ghcr.io/triplesweb/triplesweb:latest}
  proxy:
    image: nginx:stable-alpine
    profiles: [bluegreen]
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./bluegreen:/etc/nginx/conf.d:ro
    networks:
      - triples
