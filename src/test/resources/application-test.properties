# CI·로컬 공통: 외부 MariaDB 없이 컨텍스트 로드 검사
spring.datasource.url=jdbc:h2:mem:triples_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false

chemistry.seed.enabled=false
chemistry.admin.password=test
upload.sync.enabled=false
abstract.indexer.enabled=false
upload.sync.pull-on-startup=false
file.upload-dir=${java.io.tmpdir}/triplesweb-test-uploads
media.catalog.path=
youtube.api.key=
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
