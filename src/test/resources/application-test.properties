# CI·로컬 공통: 외부 MariaDB 없이 컨텍스트 로드 검사
spring.datasource.url=jdbc:h2:mem:triples_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# main의 MariaDBDialect를 덮어 H2 create-drop이 DROP FOREIGN KEY를 쓰지 않게 한다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
# 테스트는 H2에 Spring Session 스키마를 자동 생성한다 (운영은 Flyway).
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=embedded
spring.session.jdbc.platform=h2

objekt.description-seed.enabled=false
# BCrypt(test). properties 파일에서는 $ 를 $$ 로 이스케이프한다.
chemistry.admin.password=$$2y$$10$$IiwETjIm.e5AhAlu0AMvFeBoH7O5E70MUm0DwkbKxX3vr4HVw2KT.
upload.sync.enabled=false
abstract.indexer.enabled=false
upload.sync.pull-on-startup=false
file.upload-dir=${java.io.tmpdir}/triplesweb-test-uploads
media.catalog.path=
youtube.api.key=
media.sync.enabled=false
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
