spring.application.name=triplesweb
server.port=8080
server.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://100.89.171.59:3306/triples?useSSL=false}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:triples_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Tailscale 끊김 시 Nginx 502로 길게 대기하지 않도록 빠르게 실패
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Flyway 사용 시 true면 flyway ↔ entityManagerFactory 순환 의존 발생
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.jpa.show-sql=true

spring.thymeleaf.cache=false
spring.mustache.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=10GB
spring.web.resources.add-mappings=true
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# 세션 쿠키 — 프록시/HTTP에서도 전달되도록 (관리자 토큰 헤더가 주 인증)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 유튜브 api 숨기기
youtube.api.key=${YOUTUBE_API_KEY:}
objekt.api.base-url=https://objekt.top/api/v1

# 공유 DB일 때 로컬↔서버 uploads 동기화 (서버 Docker에서는 false)
upload.sync.enabled=${UPLOAD_SYNC_ENABLED:false}
upload.sync.host=${UPLOAD_SYNC_HOST:}
upload.sync.user=${UPLOAD_SYNC_USER:pi}
upload.sync.remote-dir=${UPLOAD_SYNC_REMOTE_DIR:/opt/stacks/triplesweb/uploads}
upload.sync.ssh-key=${UPLOAD_SYNC_SSH_KEY:${user.home}/.ssh/pi_ed25519}
upload.sync.pull-on-startup=${UPLOAD_SYNC_PULL_ON_STARTUP:true}

media.catalog.path=${MEDIA_CATALOG_PATH:${user.home}/triplesWeb/data/videos.json}

# 케미 관리자 (비어 있으면 로그인 비활성)
chemistry.admin.password=${CHEMISTRY_ADMIN_PASSWORD:}
# 케미 시드: 테이블이 비면 항상 적재. true면 누락 페어도 계속 채움(기존 행은 덮어쓰지 않음)
chemistry.seed.enabled=${CHEMISTRY_SEED_ENABLED:true}

# COSMO Gravity integration (keep personal access tokens in .env or deployment secrets)
gravity.apollo-base-url=${GRAVITY_APOLLO_BASE_URL:https://apollo.cafe}
gravity.cosmo-api-base-url=${GRAVITY_COSMO_API_BASE_URL:https://api.cosmo.fans}
gravity.cosmo-access-token=${COSMO_ACCESS_TOKEN:}
