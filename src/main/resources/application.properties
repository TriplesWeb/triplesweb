spring.application.name=triplesweb
server.port=8080
server.servlet.encoding.force=true
spring.jpa.defer-datasource-initialization=true

logging.level.org.hibernate.SQL=INFO
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/triples?useSSL=false}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.thymeleaf.cache=false
spring.mustache.cache=false
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=10GB
spring.web.resources.add-mappings=true
youtube.api.key=AIzaSyAX64XEZfcYBZXt38_IpJFXP5yjRNvb9Yk

spring.jpa.show-sql=true
objekt.api.base-url=https://objekt.top/api/v1
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
file.upload-dir=./uploads
spring.mvc.media-types.mp4=video/mp4
media.catalog.path=${user.home}/triplesWeb/data/videos.json






