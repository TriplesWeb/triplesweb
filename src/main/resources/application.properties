spring.application.name=triplesweb
server.port=8080
server.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://100.89.171.59:3306/triples?useSSL=false}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:triples_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:triples0213}
# Tailscale 끊김 시 Nginx 502로 길게 대기하지 않도록 빠르게 실패
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Flyway 사용 시 true면 flyway ↔ entityManagerFactory 순환 의존 발생
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql=WARN
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.mustache.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=10GB
spring.web.resources.add-mappings=true
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
# 로컬에 없는 /uploads 는 운영에서 가져와 표시 (공유 DB + 협업자 PC용).
# Docker/운영 서버는 UPLOAD_FALLBACK_BASE_URL= 로 비워 루프를 막는다.
upload.fallback-base-url=${UPLOAD_FALLBACK_BASE_URL:https://triples.eht3r.cloud}

# 세션 쿠키 — 프록시/HTTP에서도 전달되도록 (관리자 토큰 헤더가 주 인증)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# 유튜브 api 숨기기
youtube.api.key=${YOUTUBE_API_KEY:}
objekt.api.base-url=https://objekt.top/api/v1

# 공유 DB일 때 로컬↔서버 uploads 동기화 (서버 Docker에서는 false)
upload.sync.enabled=${UPLOAD_SYNC_ENABLED:false}
upload.sync.host=${UPLOAD_SYNC_HOST:}
upload.sync.user=${UPLOAD_SYNC_USER:pi}
upload.sync.remote-dir=${UPLOAD_SYNC_REMOTE_DIR:/opt/stacks/triplesweb/uploads}
upload.sync.ssh-key=${UPLOAD_SYNC_SSH_KEY:${user.home}/.ssh/pi_ed25519}
upload.sync.pull-on-startup=${UPLOAD_SYNC_PULL_ON_STARTUP:true}
# 이 크기 이하 업로드는 로컬 폴더와 함께 MariaDB upload_blob에도 저장한다.
upload.database-copy-max-bytes=${UPLOAD_DATABASE_COPY_MAX_BYTES:33554432}

media.catalog.path=${MEDIA_CATALOG_PATH:${user.home}/triplesWeb/data/videos.json}

# 케미 관리자 (비어 있으면 로그인 비활성)
chemistry.admin.password=${CHEMISTRY_ADMIN_PASSWORD:}
# 케미 시드: 테이블이 비면 항상 적재. true면 누락 페어도 계속 채움(기존 행은 덮어쓰지 않음)
chemistry.seed.enabled=${CHEMISTRY_SEED_ENABLED:true}

# COSMO Gravity — server-side credentials only
gravity.cosmo-access-token=${COSMO_ACCESS_TOKEN:}
gravity.cosmo-refresh-token=${COSMO_REFRESH_TOKEN:}
gravity.cosmo-key=${COSMO_KEY:}
gravity.credentials-file=${COSMO_CREDENTIALS_FILE:./data/cosmo/credentials.json}
gravity.cosmo-api-base-url=${COSMO_API_BASE_URL:https://api.cosmo.fans}

# 전체 체인 Transfer를 MariaDB에 쌓는 작업. 켜면 abstract_objekt_transfer가 계속 커진다.
# 보유 카드는 닉네임 검색이 지갑 주소로 바로 읽으므로 기본은 끈다.
abstract.indexer.enabled=${ABSTRACT_INDEXER_ENABLED:false}
abstract.indexer.rpc-url=${ABSTRACT_RPC_URL:https://api.mainnet.abs.xyz}
abstract.indexer.contract=${ABSTRACT_OBJEKT_CONTRACT:0x99Bb83AE9bb0C0A6be865CaCF67760947f91Cb70}
abstract.indexer.start-block=${ABSTRACT_INDEXER_START_BLOCK:6800000}
abstract.indexer.chunk-size=${ABSTRACT_INDEXER_CHUNK_SIZE:800}
abstract.indexer.chunks-per-tick=${ABSTRACT_INDEXER_CHUNKS_PER_TICK:6}
abstract.indexer.delay-ms=${ABSTRACT_INDEXER_DELAY_MS:2000}
abstract.indexer.initial-delay-ms=${ABSTRACT_INDEXER_INITIAL_DELAY_MS:15000}

gravity.privy-base-url=${COSMO_PRIVY_BASE_URL:https://auth.privy.io}
gravity.privy-app-id=${COSMO_PRIVY_APP_ID:cm7tt02g000a96m8uislrblbe}
