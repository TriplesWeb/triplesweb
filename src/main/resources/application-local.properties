# ./gradlew bootRun 전용 — src 파일을 직접 읽어 CSS/JS/템플릿 변경이 재시작 없이 반영됨
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.mustache.prefix=file:./src/main/resources/templates/
spring.mustache.cache=false
spring.mustache.servlet.cache=false

# Java: classpath(.class) 변경 시 컨텍스트만 빠르게 재시작 (devtools)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# 정적/템플릿은 file: 로 이미 즉시 반영 — 재시작 트리거에서 제외
spring.devtools.restart.exclude=static/**,public/**,templates/**
