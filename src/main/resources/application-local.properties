# IntelliJ / ./gradlew bootRun 공용 — src 파일을 직접 읽어 CSS/JS/템플릿 변경이 재시작 없이 반영됨
# 원격 MariaDB Session JDBC RTT를 피한다 (운영은 application.properties의 jdbc 유지).
spring.session.store-type=memory

spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.mustache.prefix=file:./src/main/resources/templates/
spring.mustache.cache=false
spring.mustache.servlet.cache=false

media.local-catalog.path=${MEDIA_LOCAL_CATALOG_PATH:./.idea/local-media-db/wiki-videos.json}

# Java: classpath(.class) 변경 시 컨텍스트만 빠르게 재시작 (devtools)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# 정적/템플릿은 file: 로 이미 즉시 반영 — 재시작 트리거에서 제외
spring.devtools.restart.exclude=static/**,public/**,templates/**

# application.properties 기본값과 동일. 로컬 파일이 있으면 로컬 우선, 없으면 운영으로 리다이렉트
upload.fallback-base-url=${UPLOAD_FALLBACK_BASE_URL:https://triples.eht3r.cloud}

# 운영 Pi가 ingest·카탈로그 주기 갱신을 담당. 로컬은 원격 DB 스냅샷만 읽고 UI를 검증한다.
objekt.ingest.enabled=false
objekt.cache.initial-delay-ms=86400000
objekt.live.tick-ms=86400000
