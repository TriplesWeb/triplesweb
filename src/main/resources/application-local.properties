# IntelliJ / ./gradlew bootRun 공용 — src 파일을 직접 읽어 CSS/JS/템플릿 변경이 재시작 없이 반영됨
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.mustache.prefix=file:./src/main/resources/templates/
spring.mustache.cache=false
spring.mustache.servlet.cache=false

# Java: classpath(.class) 변경 시 컨텍스트만 빠르게 재시작 (devtools)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# 정적/템플릿은 file: 로 이미 즉시 반영 — 재시작 트리거에서 제외
spring.devtools.restart.exclude=static/**,public/**,templates/**

# application.properties 기본값과 동일. 로컬 파일이 있으면 로컬 우선, 없으면 운영으로 리다이렉트
upload.fallback-base-url=${UPLOAD_FALLBACK_BASE_URL:https://triples.eht3r.cloud}

# 운영 DB를 공유하는 로컬 실행의 자동 스키마 변경·수집 쓰기를 차단한다.
# 전용 개발 DB에서 명시적으로 필요할 때만 환경 변수로 켠다.
spring.flyway.enabled=${LOCAL_FLYWAY_ENABLED:false}
schema.improve.enabled=${LOCAL_SCHEMA_IMPROVE_ENABLED:false}
app.data-initializer.enabled=${LOCAL_DATA_INITIALIZER_ENABLED:false}
chemistry.seed.enabled=${LOCAL_CHEMISTRY_SEED_ENABLED:false}
objekt.ingest.enabled=${LOCAL_OBJEKT_INGEST_ENABLED:false}
objekt.cache.persist=${LOCAL_OBJEKT_CACHE_PERSIST:false}
