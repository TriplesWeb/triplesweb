name: PR 미리보기 접속 진단
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  network:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}
      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host pi\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$PI_HOST" "$PI_USER" > ~/.ssh/config
      - name: 실제 주소와 현재 컨테이너 확인
        run: |
          ssh pi python3 - < scripts/inspect-pr-preview-network.py > /tmp/preview-network.json
          cat /tmp/preview-network.json
      - name: 다른 장비에서 미리보기 포트 접속
        run: |
          python3 - <<'PY'
          import json,subprocess
          result=json.load(open("/tmp/preview-network.json"))
          for label,address in [("actual",result["ip"]),("previous","100.89.171.59")]:
              p=subprocess.run(["curl","--noproxy","*","--connect-timeout","8","--max-time","20","--silent","--show-error","--output","/dev/null","--write-out","%{http_code}","http://"+address+":18026/api/preview/info"],capture_output=True,text=True)
              print(label+" external_http="+p.stdout+" exit="+str(p.returncode))
          if result["dns"]:
              print("PREVIEW_DNS_URL=http://"+result["dns"]+":18026/cosmo/objekt")
          PY

      - name: 비공개 HTTPS 미리보기 준비
        run: |
          ssh pi python3 - < scripts/prepare-pr-preview-https.py > /tmp/preview-https.json
          cat /tmp/preview-https.json
      - name: HTTPS 인증서와 외부 응답 확인
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          info=json.load(open("/tmp/preview-https.json"))
          if not info.get("ready"):
              print("HTTPS_SETUP_STATUS="+info.get("reason","UNKNOWN"))
              raise SystemExit(0)
          base=info["url"]
          result=subprocess.run(["curl","--noproxy","*","--resolve",info["dns"]+":"+str(info["port"])+":"+info["ip"],"--connect-timeout","10","--max-time","30","--silent","--show-error","--fail",base+"/api/preview/info"],capture_output=True,text=True)
          if result.returncode:
              print("HTTPS_CHECK_FAILED="+result.stderr[-800:])
              raise SystemExit(1)
          data=json.loads(result.stdout)
          print("HTTPS_VERIFIED_PR="+str(data["pr"]))
          print("HTTPS_PREVIEW_URL="+base+"/cosmo/objekt")
          pathlib.Path("/tmp/preview-link.txt").write_text(base+"/cosmo/objekt\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-26-https-link
          path: /tmp/preview-link.txt
          if-no-files-found: ignore
