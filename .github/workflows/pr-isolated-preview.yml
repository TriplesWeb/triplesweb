name: PR 별도 실행기 미리보기
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: isolated-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cursor/pr29-pr30-isolated-preview-b562'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 필수 검사와 최신 커밋 확인
        uses: actions/github-script@v7
        with:
          script: |
            for (let i = 0; i < 120; i++) {
              const pr = (await github.rest.pulls.get({...context.repo, pull_number:context.payload.pull_request.number})).data;
              if (pr.state !== 'open' || pr.head.sha !== process.env.REVISION) throw Error('PR이 변경되었습니다');
              const runs = (await github.rest.actions.listWorkflowRunsForRepo({...context.repo,event:'pull_request',per_page:100})).data.workflow_runs;
              const required = ['CI tests','PR code quality'].map(name => runs.find(r => r.name===name && r.head_sha===process.env.REVISION));
              if (required.some(r => r && r.status==='completed' && r.conclusion!=='success')) throw Error('필수 검사 실패');
              if (required[0] && required[1] && required[1].status==='completed' && required[1].conclusion==='success') {
                const jobs = (await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:required[0].id,per_page:100})).data.jobs;
                if (jobs.some(job => job.name==='test' && job.conclusion==='success')) return;
              }
              await new Promise(resolve => setTimeout(resolve,10000));
            }
            throw Error('필수 검사 대기 시간 초과');
      - run: ./gradlew bootWar -x test --no-daemon
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}
      - name: PR 전용 DB 준비
        env:
          SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host pi\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$PI_HOST" "$PI_USER" > ~/.ssh/config
          scp scripts/deploy-pr-preview.py "pi:/tmp/isolated-preview-${PR_NUMBER}.py"
          COMMAND="$(python3 - <<'PY'
          import os,shlex
          e=os.environ
          print(shlex.join(['python3','/tmp/isolated-preview-'+e['PR_NUMBER']+'.py','--root',e['PI_DEPLOY_PATH'],'--pr',e['PR_NUMBER'],'--database-only']))
          PY
          )"
          umask 077
          ssh pi "$COMMAND" > "$RUNNER_TEMP/preview-db-output"
          tail -n 1 "$RUNNER_TEMP/preview-db-output" > "$RUNNER_TEMP/preview-runtime.json"
          rm "$RUNNER_TEMP/preview-db-output"
      - name: 별도 실행기에서 앱 실행
        id: start
        run: python3 scripts/run-isolated-preview.py --runtime "$RUNNER_TEMP/preview-runtime.json" --pr "$PR_NUMBER" --revision "$REVISION"
      - name: PR에 미리보기 주소 표시
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.start.outputs.url }}
        with:
          script: |
            const pr = (await github.rest.pulls.get({...context.repo,pull_number:context.payload.pull_request.number})).data;
            if (pr.state !== 'open' || pr.head.sha !== process.env.REVISION) throw Error('PR이 변경되었습니다');
            const marker = /<!-- isolated-preview-start -->[\s\S]*?<!-- isolated-preview-end -->/g;
            const body = (pr.body || '').replace(marker,'').trimEnd();
            const section = '<!-- isolated-preview-start -->\n별도 실행기 Tailscale 미리보기: ' + process.env.PREVIEW_URL + '/cosmo/objekt\n커밋: ' + process.env.REVISION + '\n이 주소는 실행기 종료 시 만료됩니다.\n<!-- isolated-preview-end -->';
            await github.rest.pulls.update({...context.repo,pull_number:pr.number,body:body+'\n\n'+section});
      - name: 미리보기 유지
        run: |
          root="$RUNNER_TEMP/pr-$PR_NUMBER"
          end=$((SECONDS+19000))
          while [ "$SECONDS" -lt "$end" ]; do
            kill -0 "$(cat "$root/pid")" || exit 1
            sleep 30
          done

  peer-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cursor/pr29-pr30-isolated-preview-b562'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}
      - name: 실행기 주소 확인
        id: address
        uses: actions/github-script@v7
        with:
          script: |
            for (let i=0; i<180; i++) {
              const pr=(await github.rest.pulls.get({...context.repo,pull_number:context.payload.pull_request.number})).data;
              if (pr.state!=='open' || pr.head.sha!==process.env.REVISION) throw Error('PR이 변경되었습니다');
              const body=pr.body||'';
              if (body.includes('커밋: '+process.env.REVISION)) {
                const match=body.match(/http:\/\/(100\.\d+\.\d+\.\d+:18031)\/cosmo\/objekt/);
                if (match) { core.setOutput('url','http://'+match[1]); return; }
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('별도 실행기 주소를 받지 못했습니다');
      - name: 다른 Tailscale 기기에서 접속 검사
        env:
          TARGET: ${{ steps.address.outputs.url }}
        run: |
          set -euo pipefail
          printf '%s\n' "다른 Tailscale 실행기에서 HTTP 검사"
          curl --noproxy '*' --connect-timeout 10 --max-time 20 --fail --silent --show-error "$TARGET/api/preview/info" > /tmp/preview-info.json
          python3 - <<'PY'
          import json,os
          info=json.load(open('/tmp/preview-info.json'))
          if info.get('revision') != os.environ['REVISION'] or info.get('pr') != 31:
              raise SystemExit('미리보기 커밋 불일치')
          print('별도 Tailscale 기기에서 미리보기 연결 확인')
          PY
