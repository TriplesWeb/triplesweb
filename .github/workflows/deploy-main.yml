name: Deploy to Raspberry Pi (prod)

# PR에서는 검사만. main 머지 후 운영으로 배포. 새벽 4시는 실패 복구용 재확인.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - 'scripts/tests/**'
      # CI/tooling-only changes do not change the running application.
      - '.github/**'
      - 'scripts/ci-path-filter.py'
      - '.cursor/**'
      - '.githooks/**'
      - '.vscode/**'
      - '.env.example'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    - cron: '0 19 * * *' # 04:00 KST, fallback/reconciliation
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            docker/mariadb
            gradle
            scripts
            src/main

      - name: Full commit SHA
        id: sha
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Sync production Compose files
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          ssh pi "mkdir -p '${PI_DEPLOY_PATH}/docker/mariadb'"
          scp docker/mariadb/empty.cnf "pi:${PI_DEPLOY_PATH}/docker/mariadb/empty.cnf"
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"

      - name: Resolve Flyway migrations tree
        id: assets
        run: |
          echo "migrations=$(git rev-parse HEAD:src/main/resources/db/migration)" >> "$GITHUB_OUTPUT"

      - name: Preflight — retire dev and skip unchanged production
        id: skip
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          PI_DEV_DEPLOY_PATH: ${{ secrets.PI_DEV_DEPLOY_PATH }}
          WANT_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          MIGRATIONS_TREE: ${{ steps.assets.outputs.migrations }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH is required}"
          PI_DEV_DEPLOY_PATH="${PI_DEV_DEPLOY_PATH:-${PI_DEPLOY_PATH}-dev}"
          # 첫 전환 때만 개발 앱을 종료하고 DB/파일은 보존한다.
          scp scripts/retire-pi-dev.sh "pi:${PI_DEPLOY_PATH}/retire-pi-dev.sh"
          DECISION="$(ssh pi env PI_DEPLOY_PATH="$PI_DEPLOY_PATH" PI_DEV_DEPLOY_PATH="$PI_DEV_DEPLOY_PATH" WANT_IMAGE="$WANT_IMAGE" MIGRATIONS_TREE="$MIGRATIONS_TREE" bash -s <<'EOF'
          set -euo pipefail
          if [[ ! -f "${PI_DEPLOY_PATH}/.dev-retired" ]]; then
            bash "${PI_DEPLOY_PATH}/retire-pi-dev.sh" "${PI_DEPLOY_PATH}" "${PI_DEV_DEPLOY_PATH}"
            touch "${PI_DEPLOY_PATH}/.dev-retired"
          fi
          cd "${PI_DEPLOY_PATH}"
          APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8090}"
          CID="$(docker compose -f docker-compose.yml ps -q app 2>/dev/null || true)"
          RUNNING=""
          if [[ -n "$CID" ]]; then
            RUNNING="$(docker inspect -f '{{.Config.Image}}' "$CID")"
          fi
          BASE_URL="http://127.0.0.1:$APP_PORT"
          if [[ "$RUNNING" == "$WANT_IMAGE" && "$(cat .deploy-migration-tree 2>/dev/null || true)" == "$MIGRATIONS_TREE" ]] &&
            curl -fsS --max-time 8 "$BASE_URL/actuator/health/readiness" >/dev/null &&
            [[ "$(curl -fsS --max-time 8 -o /dev/null -w '%{http_code}' "$BASE_URL/")" == 200 ]]; then
            echo "skip=true"
          else
            echo "skip=false"
          fi
          EOF
          )"
          SKIP="$(echo "$DECISION" | grep -E '^skip=' | tail -n1 | cut -d= -f2)"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::Prod already healthy on ${WANT_IMAGE}; skipping rebuild/restart"
          else
            echo "Will deploy ${WANT_IMAGE}"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse immutable SHA image when a previous rollout failed
        id: published
        if: steps.skip.outputs.skip != 'true'
        env:
          SHA_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$SHA_IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found previously built image $SHA_IMAGE — skip Docker rebuild"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true' && steps.published.outputs.found != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.sha }}
            type=raw,value=latest

      - name: Build and push (linux/arm64)
        if: steps.skip.outputs.skip != 'true' && steps.published.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triplesweb-arm64
          cache-to: type=gha,mode=max,scope=triplesweb-arm64,ignore-error=true
          provenance: false

      - name: Replace production app
        if: steps.skip.outputs.skip != 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          MIGRATIONS_TREE: ${{ steps.assets.outputs.migrations }}
          APP_MEMORY_LIMIT: ${{ vars.APP_MEMORY_LIMIT || '1800m' }}
          APP_READY_TIMEOUT_SECONDS: ${{ vars.APP_READY_TIMEOUT_SECONDS || '360' }}
          APP_STOP_TIMEOUT_SECONDS: ${{ vars.APP_STOP_TIMEOUT_SECONDS || '600' }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          scp scripts/deploy-pi-app.sh scripts/deploy-pi-image-retention.sh scripts/migrate-chemistry-photos-on-pi.sh "pi:${PI_DEPLOY_PATH}/"
          # 케미 UI는 WAR static(/images/chemistry). 페어 사진은 서버 uploads만.
          # 옛 chem/ → images/chemistry/ 복사는 멱등 (원본 유지).
          ssh pi "bash '${PI_DEPLOY_PATH}/migrate-chemistry-photos-on-pi.sh' '${PI_DEPLOY_PATH}'"

          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            MIGRATIONS_TREE="$MIGRATIONS_TREE" \
            APP_MEMORY_LIMIT="$APP_MEMORY_LIMIT" \
            APP_READY_TIMEOUT_SECONDS="$APP_READY_TIMEOUT_SECONDS" \
            APP_STOP_TIMEOUT_SECONDS="$APP_STOP_TIMEOUT_SECONDS" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$PI_DEPLOY_PATH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          export APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8090}"
          bash ./deploy-pi-app.sh
          EOF
