name: Deploy to Raspberry Pi (prod)

# PR에서는 검사만. main 머지 후 운영으로 배포. 새벽 4시는 실패 복구용 재확인.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - 'scripts/tests/**'
  schedule:
    - cron: '0 19 * * *' # 04:00 KST, fallback/reconciliation
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Full commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale (early — skip if already on this SHA)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Retire obsolete Pi development container (never remove data)
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          PI_DEV_DEPLOY_PATH: ${{ secrets.PI_DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH is required}"
          PI_DEV_DEPLOY_PATH="${PI_DEV_DEPLOY_PATH:-${PI_DEPLOY_PATH}-dev}"
          scp scripts/retire-pi-dev.sh "pi:${PI_DEPLOY_PATH}/retire-pi-dev.sh"
          ssh pi env PI_DEPLOY_PATH="$PI_DEPLOY_PATH" PI_DEV_DEPLOY_PATH="$PI_DEV_DEPLOY_PATH" bash -s <<'EOF'
          set -euo pipefail
          bash "${PI_DEPLOY_PATH}/retire-pi-dev.sh" "$PI_DEPLOY_PATH" "$PI_DEV_DEPLOY_PATH"
          EOF

      - name: Skip if prod container already healthy on this commit
        id: skip
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          WANT_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # .env IMAGE와 무관하게 실제 실행 중인 이미지·readiness로 재배포를 판단
          DECISION="$(ssh pi env PI_DEPLOY_PATH="$PI_DEPLOY_PATH" WANT_IMAGE="$WANT_IMAGE" bash -s <<'EOF'
          set -euo pipefail
          cd "${PI_DEPLOY_PATH}"
          APP_PORT="$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)"
          APP_PORT="${APP_PORT:-8080}"
          CID="$(docker compose ps -q app 2>/dev/null || true)"
          if [[ -z "${CID}" ]]; then
            echo "skip=false"
            echo "reason=no-running-app" >&2
            exit 0
          fi
          RUNNING="$(docker inspect -f '{{.Config.Image}}' "${CID}" 2>/dev/null || true)"
          if [[ "${RUNNING}" != "${WANT_IMAGE}" ]]; then
            echo "skip=false"
            echo "reason=image-mismatch running=${RUNNING:-<none>} want=${WANT_IMAGE}" >&2
            exit 0
          fi
          if curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/actuator/health/readiness" >/dev/null; then
            echo "skip=true"
          else
            echo "skip=false"
            echo "reason=smoke-failed" >&2
          fi
          EOF
          )"
          SKIP="$(echo "$DECISION" | grep -E '^skip=' | tail -n1 | cut -d= -f2)"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::Prod already healthy on ${WANT_IMAGE}; skipping rebuild/restart"
          else
            echo "Will deploy ${WANT_IMAGE}"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.sha }}
            type=raw,value=latest

      - name: Build and push (linux/arm64)
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triplesweb-arm64
          cache-to: type=gha,mode=max,scope=triplesweb-arm64
          provenance: false

      - name: Sync only chemistry assets and deploy
        if: steps.skip.outputs.skip != 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"
          scp scripts/deploy-pi-app.sh "pi:${PI_DEPLOY_PATH}/deploy-pi-app.sh"
          # 업로드 루트 삭제/재귀 chown 없이 관리 대상 chemistry만 증분 복사한다.
          ssh pi "mkdir -p '${PI_DEPLOY_PATH}/uploads/chemistry'"
          rsync -az --no-owner --no-group --exclude '.DS_Store' \
            uploads/chemistry/ "pi:${PI_DEPLOY_PATH}/uploads/chemistry/"

          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$PI_DEPLOY_PATH"
          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
          else
            printf 'IMAGE=%s\n' "$IMAGE" >> .env
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          export APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8090}"
          bash ./deploy-pi-app.sh prod
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF
