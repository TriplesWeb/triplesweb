name: Deploy to Raspberry Pi (prod)

# 기본: 매일 새벽 4시(KST) 또는 Actions 수동 실행.
# 예외: main 머지 푸시이면서, 해당 PR 코멘트에 「즉시 배포」가 있으면 바로 운영 반영.
on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - '.github/workflows/**'
      - 'scripts/tests/**'

# Serialize deployments and avoid interrupting an in-flight remote restart.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read
  issues: read

env:
  REGISTRY: ghcr.io
  IMMEDIATE_DEPLOY_PHRASE: '즉시 배포'

jobs:
  resolve-main:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      deploy: ${{ steps.head.outputs.deploy }}
    steps:
      - name: Resolve deploy target and gate push-to-main
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PHRASE: ${{ env.IMMEDIATE_DEPLOY_PHRASE }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploy (${EVENT_NAME}): ${CURRENT_SHA}"
            exit 0
          fi

          # push to main: only when merged PR has the magic comment
          echo "sha=${PUSH_SHA}" >> "$GITHUB_OUTPUT"
          PR_NUMBER="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/commits/${PUSH_SHA}/pulls" \
            --jq '.[0].number // empty' || true)"
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main push ${PUSH_SHA} has no associated PR; skip prod (wait for 04:00 KST or manual)"
            exit 0
          fi

          # PR 본문 + 이슈 코멘트 + 리뷰 코멘트에서 「즉시 배포」 검색
          BODY="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          ISSUE_COMMENTS="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[].body // empty' || true)"
          REVIEW_COMMENTS="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" --jq '.[].body // empty' || true)"
          ALL="${BODY}"$'\n'"${ISSUE_COMMENTS}"$'\n'"${REVIEW_COMMENTS}"

          if printf '%s' "$ALL" | grep -Fq "$PHRASE"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #${PR_NUMBER} contains「${PHRASE}」→ immediate prod deploy of ${PUSH_SHA}"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #${PR_NUMBER} has no「${PHRASE}」comment; skip prod (wait for 04:00 KST or manual)"
          fi

  build-and-deploy:
    needs: resolve-main
    if: needs.resolve-main.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout main tip
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-main.outputs.sha }}

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale (early — skip if already on this SHA)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Skip if prod container already healthy on this commit
        id: skip
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          WANT_IMAGE: ${{ steps.image.outputs.name }}:${{ needs.resolve-main.outputs.sha }}
        run: |
          set -euo pipefail
          # .env IMAGE만 보면 실패 후 재시도가 스킵되므로, 실행 중 컨테이너 + smoke로 판정한다.
          DECISION="$(ssh pi env PI_DEPLOY_PATH="$PI_DEPLOY_PATH" WANT_IMAGE="$WANT_IMAGE" bash -s <<'EOF'
          set -euo pipefail
          cd "${PI_DEPLOY_PATH}"
          APP_PORT="$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)"
          APP_PORT="${APP_PORT:-8080}"
          CID="$(docker compose ps -q app 2>/dev/null || true)"
          if [[ -z "${CID}" ]]; then
            echo "skip=false"
            echo "reason=no-running-app" >&2
            exit 0
          fi
          RUNNING="$(docker inspect -f '{{.Config.Image}}' "${CID}" 2>/dev/null || true)"
          if [[ "${RUNNING}" != "${WANT_IMAGE}" ]]; then
            echo "skip=false"
            echo "reason=image-mismatch running=${RUNNING:-<none>} want=${WANT_IMAGE}" >&2
            exit 0
          fi
          if curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/actuator/health/readiness" >/dev/null; then
            echo "skip=true"
          else
            echo "skip=false"
            echo "reason=smoke-failed" >&2
          fi
          EOF
          )"
          SKIP="$(echo "$DECISION" | grep -E '^skip=' | tail -n1 | cut -d= -f2)"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::Prod already healthy on ${WANT_IMAGE}; skipping rebuild/restart"
          else
            echo "Will deploy ${WANT_IMAGE}"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.resolve-main.outputs.sha }}
            type=raw,value=latest

      - name: Build and push (linux/arm64)
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triplesweb-arm64
          cache-to: type=gha,mode=max,scope=triplesweb-arm64
          provenance: false

      - name: Sync only chemistry assets and deploy
        if: steps.skip.outputs.skip != 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.resolve-main.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"
          scp scripts/deploy-pi-app.sh "pi:${PI_DEPLOY_PATH}/deploy-pi-app.sh"
          # 업로드 루트 삭제/재귀 chown 없이 관리 대상 chemistry만 증분 복사한다.
          ssh pi "mkdir -p '${PI_DEPLOY_PATH}/uploads/chemistry'"
          rsync -az --no-owner --no-group --exclude '.DS_Store' \
            uploads/chemistry/ "pi:${PI_DEPLOY_PATH}/uploads/chemistry/"

          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$PI_DEPLOY_PATH"
          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
          else
            printf 'IMAGE=%s\n' "$IMAGE" >> .env
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          export APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8090}"
          bash ./deploy-pi-app.sh prod
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF
