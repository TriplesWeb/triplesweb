name: Deploy to Raspberry Pi (prod)

# PR에서는 검사만. main 머지 후 운영으로 배포. 새벽 4시는 실패 복구용 재확인.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - 'scripts/tests/**'
      # CI/tooling-only changes do not change the running application.
      - '.github/**'
      - 'scripts/ci-path-filter.py'
      - '.cursor/**'
      - '.githooks/**'
      - '.vscode/**'
      - '.env.example'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    - cron: '0 19 * * *' # 04:00 KST, fallback/reconciliation
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Full commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale (early — skip if already on this SHA)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Check current production image and tracked assets
        id: assets
        run: echo "tree=$(git rev-parse HEAD:uploads/chemistry)" >> "$GITHUB_OUTPUT"

      - name: Preflight — retire dev and skip unchanged production
        id: skip
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          PI_DEV_DEPLOY_PATH: ${{ secrets.PI_DEV_DEPLOY_PATH }}
          WANT_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          CHEMISTRY_TREE: ${{ steps.assets.outputs.tree }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH is required}"
          PI_DEV_DEPLOY_PATH="${PI_DEV_DEPLOY_PATH:-${PI_DEPLOY_PATH}-dev}"
          # 첫 전환 때만 개발 앱을 종료하고 DB/파일은 보존한다.
          scp scripts/retire-pi-dev.sh "pi:${PI_DEPLOY_PATH}/retire-pi-dev.sh"
          DECISION="$(ssh pi env PI_DEPLOY_PATH="$PI_DEPLOY_PATH" PI_DEV_DEPLOY_PATH="$PI_DEV_DEPLOY_PATH" WANT_IMAGE="$WANT_IMAGE" CHEMISTRY_TREE="$CHEMISTRY_TREE" bash -s <<'EOF'
          set -euo pipefail
          if [[ ! -f "${PI_DEPLOY_PATH}/.dev-retired" ]]; then
            bash "${PI_DEPLOY_PATH}/retire-pi-dev.sh" "${PI_DEPLOY_PATH}" "${PI_DEV_DEPLOY_PATH}"
            touch "${PI_DEPLOY_PATH}/.dev-retired"
          fi
          cd "${PI_DEPLOY_PATH}"
          ASSETS_UP_TO_DATE=false
          if [[ -f .chemistry-tree ]] && [[ "$(cat .chemistry-tree)" == "${CHEMISTRY_TREE}" ]] && [[ -d uploads/chemistry ]]; then
            echo "chemistry_sync=false"
            ASSETS_UP_TO_DATE=true
          else
            echo "chemistry_sync=true"
          fi
          APP_PORT="$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)"
          APP_PORT="${APP_PORT:-8080}"
          CID="$(docker compose ps -q app 2>/dev/null || true)"
          if [[ -z "${CID}" ]]; then
            echo "skip=false"
            echo "reason=no-running-app" >&2
            exit 0
          fi
          RUNNING="$(docker inspect -f '{{.Config.Image}}' "${CID}" 2>/dev/null || true)"
          if [[ "${RUNNING}" != "${WANT_IMAGE}" ]]; then
            echo "skip=false"
            echo "reason=image-mismatch running=${RUNNING:-<none>} want=${WANT_IMAGE}" >&2
            exit 0
          fi
          if curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/actuator/health/readiness" >/dev/null; then
            if [[ "${ASSETS_UP_TO_DATE}" == "true" ]]; then
              echo "skip=true"
            else
              echo "skip=false"
              echo "reason=chemistry-out-of-date" >&2
            fi
          else
            echo "skip=false"
            echo "reason=smoke-failed" >&2
          fi
          EOF
          )"
          SKIP="$(echo "$DECISION" | grep -E '^skip=' | tail -n1 | cut -d= -f2)"
          CHEMISTRY_SYNC="$(echo "$DECISION" | grep -E '^chemistry_sync=' | tail -n1 | cut -d= -f2)"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "chemistry_sync=${CHEMISTRY_SYNC}" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::Prod already healthy on ${WANT_IMAGE}; skipping rebuild/restart"
          else
            echo "Will deploy ${WANT_IMAGE}"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse immutable SHA image when a previous rollout failed
        id: published
        if: steps.skip.outputs.skip != 'true'
        env:
          SHA_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$SHA_IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found previously built image $SHA_IMAGE — skip Docker rebuild"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true' && steps.published.outputs.found != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.sha }}
            type=raw,value=latest

      - name: Build and push (linux/arm64)
        if: steps.skip.outputs.skip != 'true' && steps.published.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triplesweb-arm64
          cache-to: type=gha,mode=max,scope=triplesweb-arm64,ignore-error=true
          provenance: false

      - name: Sync only chemistry assets and deploy
        if: steps.skip.outputs.skip != 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"
          scp scripts/deploy-pi-app.sh "pi:${PI_DEPLOY_PATH}/deploy-pi-app.sh"
          # chemistry Git tree SHA가 동일하면 원격 스캔·전송을 건너뛴다.
          if [[ "${{ steps.skip.outputs.chemistry_sync }}" == "true" ]]; then
            ssh pi "mkdir -p '${PI_DEPLOY_PATH}/uploads/chemistry'"
            rsync -a --no-owner --no-group --exclude '.DS_Store' \
              uploads/chemistry/ "pi:${PI_DEPLOY_PATH}/uploads/chemistry/"
            ssh pi "echo '${{ steps.assets.outputs.tree }}' > '${PI_DEPLOY_PATH}/.chemistry-tree'"
            echo "Chemistry files synchronized for ${{ steps.assets.outputs.tree }}"
          else
            echo "Chemistry unchanged — skipping rsync"
          fi

          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$PI_DEPLOY_PATH"
          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
          else
            printf 'IMAGE=%s\n' "$IMAGE" >> .env
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          export APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8090}"
          bash ./deploy-pi-app.sh prod
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF
