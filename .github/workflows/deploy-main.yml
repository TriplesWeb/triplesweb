name: Deploy to Raspberry Pi (prod)

# 머지 직후가 아니라 매일 새벽 4시(KST)에 운영 반영.
# 긴급 반영은 Actions에서 workflow_dispatch로 수동 실행.
on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:

# Serialize deployments and avoid interrupting an in-flight remote restart.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-main:
    # Always deploy the current main tip (schedule / manual).
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve latest main tip
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT_SHA="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          echo "sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploy target: ${CURRENT_SHA}"

  build-and-deploy:
    needs: resolve-main
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout main tip
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-main.outputs.sha }}

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale (early — skip if already on this SHA)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Skip if prod already on this commit
        id: skip
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          WANT_IMAGE: ${{ steps.image.outputs.name }}:${{ needs.resolve-main.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT="$(ssh pi "grep -E '^IMAGE=' '${PI_DEPLOY_PATH}/.env' 2>/dev/null | cut -d= -f2- || true")"
          if [[ "$CURRENT" == "$WANT_IMAGE" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Prod already on ${WANT_IMAGE}; skipping rebuild/restart"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Prod IMAGE now: ${CURRENT:-<empty>} → ${WANT_IMAGE}"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.skip.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.resolve-main.outputs.sha }}
            type=raw,value=latest

      - name: Build and push (linux/arm64)
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Sync compose, chemistry assets, and deploy
        if: steps.skip.outputs.skip != 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.resolve-main.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"
          ssh pi "set -euo pipefail
            mkdir -p \"${PI_DEPLOY_PATH}/uploads\"
            docker run --rm -v \"${PI_DEPLOY_PATH}/uploads:/uploads\" alpine:3.20 \
              chown -R \"\$(id -u):\$(id -g)\" /uploads
          "
          rsync -az --delete --no-owner --no-group \
            --exclude '.DS_Store' \
            --exclude '*.orig' \
            --exclude '**/.DS_Store' \
            --exclude '**/*.orig' \
            --filter 'P images/' \
            --filter 'P images/**' \
            --filter 'P videos/' \
            --filter 'P videos/**' \
            --filter 'P files/' \
            --filter 'P files/**' \
            -e ssh \
            uploads/ "pi:${PI_DEPLOY_PATH}/uploads/"
          ssh pi "chmod -R a+rwX \"${PI_DEPLOY_PATH}/uploads\""
          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "${PI_DEPLOY_PATH}"
          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i.bak "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
          else
            echo "IMAGE=${IMAGE}" >> .env
          fi
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker compose pull app
          docker compose up -d
          docker image prune -f
          docker logout ghcr.io >/dev/null 2>&1 || true
          APP_PORT="$(grep -E '^APP_PORT=' .env | cut -d= -f2- || true)"
          APP_PORT="${APP_PORT:-8080}"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/" >/dev/null; then
              echo "Smoke OK: / on :${APP_PORT} (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke failed: / on :${APP_PORT} did not respond"
          docker compose ps || true
          docker compose logs --tail=200 app || true
          exit 1
          EOF
