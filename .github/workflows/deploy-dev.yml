name: Deploy PR to Pi (dev)

# PR이 열리거나 동기화되면 개발 스택에 즉시 반영.
# 빌드는 PR별 최신 커밋만 수행하고, Pi 적용은 글로벌 직렬화한다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - '.github/workflows/ci-tests.yml'
      - '.github/workflows/qodana_code_quality.yml'
      - '.github/workflows/deploy-main.yml'
      - 'scripts/tests/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/SHA). Empty = current default.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Fork PR에는 secrets가 없어 배포 생략
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: dev-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.ref }}" ]]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Commit SHA (always full sha — branch names are not valid image tags)
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=dev-${{ steps.sha.outputs.sha }}
            type=raw,value=pr-${{ github.event.pull_request.number || 'manual' }}-${{ steps.sha.outputs.sha }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=triplesweb-arm64
          cache-to: type=gha,mode=max,scope=triplesweb-arm64
          provenance: false

  deploy:
    name: deploy latest PR on Pi
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Reject superseded PR build
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          WANT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            STATE_AND_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha] | join(" ")')"
            if [[ "$STATE_AND_SHA" != "open $WANT_SHA" ]]; then
              echo "::notice::PR was closed or updated; skip superseded build $WANT_SHA"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Connect Tailscale
        if: steps.fresh.outputs.deploy == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy isolated dev stack
        if: steps.fresh.outputs.deploy == 'true'
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          PI_DEV_DEPLOY_PATH: ${{ secrets.PI_DEV_DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}:dev-${{ needs.build.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${PI_DEPLOY_PATH:?PI_DEPLOY_PATH secret is required}"
          PI_DEV_DEPLOY_PATH="${PI_DEV_DEPLOY_PATH:-${PI_DEPLOY_PATH}-dev}"
          ssh pi "mkdir -p '${PI_DEV_DEPLOY_PATH}'"
          scp docker-compose.dev.yml "pi:${PI_DEV_DEPLOY_PATH}/docker-compose.yml"
          scp scripts/ensure-dev-db.sh "pi:${PI_DEV_DEPLOY_PATH}/ensure-dev-db.sh"
          scp scripts/deploy-pi-app.sh "pi:${PI_DEV_DEPLOY_PATH}/deploy-pi-app.sh"

          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            PI_DEV_DEPLOY_PATH="$PI_DEV_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$PI_DEV_DEPLOY_PATH"
          bash ./ensure-dev-db.sh "$PI_DEPLOY_PATH" "$PI_DEV_DEPLOY_PATH"
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
          else
            printf 'IMAGE=%s\n' "$IMAGE" >> .env
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          export APP_PORT="$(sed -n 's/^APP_PORT=//p' .env | tail -n1)"
          APP_PORT="${APP_PORT:-8091}"
          bash ./deploy-pi-app.sh dev
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF

      - name: Comment deploy URL on PR
        if: steps.fresh.outputs.deploy == 'true' && github.event_name == 'pull_request' && vars.PI_DEV_PUBLIC_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const base = '${{ vars.PI_DEV_PUBLIC_URL }}'.replace(/\/$/, '');
            const sha = '${{ needs.build.outputs.sha }}'.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '개발 서버 반영 완료 (' + sha + ').\n\n- ' + base + '/main'
            });
