name: Build and deploy to Raspberry Pi

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'qodana.yaml'
      - '.github/workflows/qodana_code_quality.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    # Native arm64 — avoids QEMU emulation (largest speedup)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host pi
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Sync compose, chemistry assets, and deploy
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:latest
          GHCR_USER: ${{ github.actor }}
          # Prefer a PAT with read:packages (GHCR_TOKEN); fall back to job token
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scp docker-compose.yml "pi:${PI_DEPLOY_PATH}/docker-compose.yml"
          # uploads/ 전체 동기화
          # 1) 컨테이너(root)가 만든 파일은 배포 유저가 못 지우므로 rsync 전 chown
          # 2) rsync는 소유자/그룹을 보내지 않음 (--no-owner --no-group) → 권한 충돌 방지
          # 3) rsync 후 a+rwX 로 열어 컨테이너·다음 배포가 모두 쓸 수 있게 함
          ssh pi "set -euo pipefail
            mkdir -p \"${PI_DEPLOY_PATH}/uploads\"
            docker run --rm -v \"${PI_DEPLOY_PATH}/uploads:/uploads\" alpine:3.20 \
              chown -R \"\$(id -u):\$(id -g)\" /uploads
          "
          # --delete 로 레포에 없는 런타임 업로드(images/chemistry 등)를 지우지 않도록 protect
          rsync -az --delete --no-owner --no-group \
            --exclude '.DS_Store' \
            --exclude '*.orig' \
            --exclude '**/.DS_Store' \
            --exclude '**/*.orig' \
            --filter 'P images/chemistry/' \
            --filter 'P images/chemistry/**' \
            --filter 'P images/free/' \
            --filter 'P images/free/**' \
            --filter 'P images/trade/' \
            --filter 'P images/trade/**' \
            --filter 'P images/notice/' \
            --filter 'P images/notice/**' \
            --filter 'P videos/' \
            --filter 'P videos/**' \
            --filter 'P files/' \
            --filter 'P files/**' \
            -e ssh \
            uploads/ "pi:${PI_DEPLOY_PATH}/uploads/"
          ssh pi "chmod -R a+rwX \"${PI_DEPLOY_PATH}/uploads\""
          ssh pi env \
            PI_DEPLOY_PATH="$PI_DEPLOY_PATH" \
            IMAGE="$IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "${PI_DEPLOY_PATH}"
          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i.bak "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
          else
            echo "IMAGE=${IMAGE}" >> .env
          fi
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker compose pull app
          docker compose up -d
          docker image prune -f
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF
