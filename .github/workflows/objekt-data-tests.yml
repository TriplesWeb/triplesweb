name: Objekt data reads
on:
  push:
    branches: [main, verify/objekt-modal, verify/cosmo-feedback, verify/mobile-orbits, verify/artist-gravity, verify/intellij-startup]
    paths:
      - 'src/**'
      - 'scripts/tests/objekt-*.cjs'
      - '.github/workflows/objekt-data-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/tests/objekt-*.test.cjs'
      - '.github/workflows/objekt-data-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --tests '*ObjektMarketDataServiceTest' --tests '*ObjektTransferServiceTest' --tests '*CosmoCollectionServiceTest' --tests '*ObjektFeaturesTest' --tests '*ObjektActivityClientTest' --tests '*ObjektIngestStoreTest' --tests '*ArticleObjektOrderingTest' --tests '*CosmoProfileServiceTest' --tests '*CosmoProfileControllerTest' --tests '*CosmoCollectionControllerTest' --tests '*MobilePageTemplatesTest' --tests '*ArtistPerformanceTest' --tests '*ArtistSpotlightBoundedTest' --tests '*GravityControllerTest' --tests '*DotenvEnvironmentPostProcessorTest' --tests '*triplesWebApplicationTests'
      - if: failure()
        run: grep -n -A 10 -B 2 -E 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test/*.xml || true
      - run: node scripts/tests/objekt-detail.test.cjs && node scripts/tests/objekt-transfers.test.cjs
      - name: Validate live public APIs
        env:
          OBJEKT_LIVE_TEST: 'true'
        run: ./gradlew test --tests '*ObjektLiveApiTest' --info
      - name: 전송 내역 브라우저 검증
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          npm install --prefix /tmp/objekt-browser --no-package-lock playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-account-ui.browser.cjs
          node scripts/tests/objekt-modal.browser.cjs
          node scripts/tests/objekt-mobile.browser.cjs
          node scripts/tests/objekt-artist-gravity.browser.cjs
          node scripts/tests/objekt-member-selection.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objekt-transfers-preview
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-page-fixtures
          path: build/mobile-pages/*.html
  safari:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
      - uses: actions/download-artifact@v4
        with:
          name: mobile-page-fixtures
          path: build/mobile-pages
      - name: iPhone WebKit 모바일 검사
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
          BROWSER_ENGINE: webkit
        run: |
          npm install --prefix /tmp/objekt-browser --no-package-lock playwright@1.56.1
          /tmp/objekt-browser/node_modules/.bin/playwright install webkit
          node scripts/tests/objekt-mobile.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-mobile-preview
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore
