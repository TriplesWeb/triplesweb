name: Objekt data reads
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/tests/objekt-*.test.cjs'
      - '.github/workflows/objekt-data-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --tests '*ObjektMarketDataServiceTest' --tests '*ObjektTransferServiceTest' --tests '*CosmoCollectionServiceTest' --tests '*ObjektFeaturesTest' --tests '*ObjektActivityClientTest' --tests '*ObjektIngestStoreTest'
      - if: failure()
        run: rg -n -A 10 -B 2 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test || true
      - run: node scripts/tests/objekt-detail.test.cjs && node scripts/tests/objekt-transfers.test.cjs
