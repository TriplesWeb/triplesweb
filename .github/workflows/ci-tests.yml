name: CI tests

# Run full checks only on PRs targeting main, not again after the merge.
on:
  pull_request:
    branches: [main]

# Avoid paying for obsolete commits when a PR is updated.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Full test suite runs on PR's synthetic merge commit, including conflict fixes.
      - name: Full Gradle test suite
        run: ./gradlew test --no-daemon --stacktrace
      - if: failure()
        run: grep -n -A 10 -B 2 -E 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test/*.xml || true
      - run: node scripts/tests/objekt-detail.test.cjs && node scripts/tests/objekt-transfers.test.cjs && node scripts/tests/objekt-kind-combo.test.cjs
      - name: Validate live public APIs
        env:
          OBJEKT_LIVE_TEST: 'true'
        run: ./gradlew test --tests '*ObjektLiveApiTest' --info
      - name: Chrome 브라우저 검증
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          npm install --prefix /tmp/objekt-browser --no-package-lock playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-account-ui.browser.cjs
          node scripts/tests/objekt-modal.browser.cjs
          node scripts/tests/profile-board.browser.cjs
          node scripts/tests/objekt-mobile.browser.cjs
          node scripts/tests/site-header.browser.cjs
          node scripts/tests/objekt-artist-gravity.browser.cjs
          node scripts/tests/objekt-member-selection.browser.cjs
          node scripts/tests/objekt-season-schedule.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objekt-transfers-preview
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spring WAR 패키징 (Docker와 동일)
        run: ./gradlew bootWar -x test --no-daemon --stacktrace

  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        env:
          # Optional: cloud upload/PR comment. Community linter still enforces qodana.yaml gates without it.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: true
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: false
          push-fixes: 'none'

  required:
    name: required
    if: ${{ always() }}
    needs: [test, package, qodana]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless Spring and Chrome checks succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          QODANA_RESULT: ${{ needs.qodana.result }}
        run: |
          [[ "$TEST_RESULT" == "success" && "$PACKAGE_RESULT" == "success" && "$QODANA_RESULT" == "success" ]] || exit 1
