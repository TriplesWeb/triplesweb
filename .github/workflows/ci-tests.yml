name: CI tests

# Run full checks only on PRs targeting main, not again after the merge.
on:
  pull_request:
    branches: [main]

# Avoid paying for obsolete commits when a PR is updated.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Decide whether app checks are needed
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only --no-renames "$BASE"..."$HEAD")
          printf 'Changed files:\n'
          printf '  %s\n' "${files[@]:-}"

          app=false
          for f in "${files[@]:-}"; do
            # App/test code still needs the full suite.
            if [[ "$f" == scripts/tests/* ]]; then
              app=true
              break
            fi
            # Docs, deploy/CI scripts, editor/meta files can skip heavy checks.
            case "$f" in
              package.json|package-lock.json|scripts/setup-css.sh|scripts/build-*-css.cjs|scripts/build-css.cjs|scripts/build-tw4.cjs|scripts/check-css-drift.cjs|scripts/tailwind*.cjs|scripts/css/*)
                app=true
                break
                ;;
              *.md|docs/*|.github/*|.githooks/*|.cursor/*|.vscode/*|.gitignore|.gitattributes|.dockerignore|.env.example|LICENSE*|scripts/*)
                ;;
              *)
                app=true
                break
                ;;
            esac
          done

          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [[ "$app" == "true" ]]; then
            echo "App-related paths changed — running full checks."
          else
            echo "Docs/scripts/meta only — skipping test, package, and qodana."
          fi

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: CSS setup + drift check
        run: ./scripts/setup-css.sh --check
      # Full test suite runs on PR's synthetic merge commit, including conflict fixes.
      - name: Full Gradle test suite
        run: ./gradlew test --no-daemon --stacktrace
      - if: failure()
        run: grep -n -A 10 -B 2 -E 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test/*.xml || true
      - run: node scripts/tests/objekt-detail.test.cjs && node scripts/tests/objekt-transfers.test.cjs && node scripts/tests/objekt-kind-combo.test.cjs
      - name: Validate live public APIs
        env:
          OBJEKT_LIVE_TEST: 'true'
        run: ./gradlew test --tests '*ObjektLiveApiTest' --info
      - name: Chrome 브라우저 검증
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          npm install --prefix /tmp/objekt-browser --no-package-lock playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-account-ui.browser.cjs
          node scripts/tests/objekt-modal.browser.cjs
          node scripts/tests/objekt-desc-leading.browser.cjs
          node scripts/tests/profile-board.browser.cjs
          node scripts/tests/objekt-mobile.browser.cjs
          node scripts/tests/site-header.browser.cjs
          node scripts/tests/objekt-artist-gravity.browser.cjs
          node scripts/tests/objekt-member-selection.browser.cjs
          node scripts/tests/objekt-live-filters.browser.cjs
          node scripts/tests/objekt-card-chrome.browser.cjs
          node scripts/tests/collection-live-filters.browser.cjs
          node scripts/tests/collection-dropdown-layout.browser.cjs
          node scripts/tests/profile-ownership-tabs.browser.cjs
          node scripts/tests/objekt-season-schedule.browser.cjs
          node scripts/tests/scroll-top.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objekt-transfers-preview
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore

  package:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: CSS setup (npm ci + build:css)
        run: ./scripts/setup-css.sh --no-run
      - name: Spring WAR 패키징 (Docker와 동일)
        run: ./gradlew bootWar -x test --no-daemon --stacktrace

  qodana:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Qodana CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          archive="/tmp/qodana.tar.gz"
          asset="https://api.github.com/repos/JetBrains/qodana-cli/releases/assets/585558698"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --max-time 180 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "$archive" "$asset" \
               && echo "b1fc01fb5825f4c6382f9cedcfe97d4a8eeaaddc9f5384a3b5870ca63e231c6f  $archive" | sha256sum -c -; then
              ok=1
              break
            fi
            echo "Qodana CLI download failed (attempt $i), retrying..."
            sleep $((i * 8))
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::warning::GitHub Releases 504/timeout — Qodana scan skipped so required is not blocked by infrastructure."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo tar -xzf "$archive" -C /usr/local/bin
          qodana --version
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: Qodana Scan
        if: steps.cli.outputs.skipped != 'true'
        uses: JetBrains/qodana-action@v2026.2
        with:
          use-installed-cli: true
          pr-mode: true
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: false
          push-fixes: 'none'

  required:
    name: required
    if: ${{ always() }}
    needs: [changes, test, package, qodana]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce merge gate
        env:
          APP: ${{ needs.changes.outputs.app }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          QODANA_RESULT: ${{ needs.qodana.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi
          if [[ "$APP" != "true" ]]; then
            echo "Docs/scripts/meta-only PR — full checks skipped."
            exit 0
          fi
          [[ "$TEST_RESULT" == "success" && "$PACKAGE_RESULT" == "success" && "$QODANA_RESULT" == "success" ]] || exit 1
