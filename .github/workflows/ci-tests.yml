name: CI tests

# Run full checks only on PRs targeting main, not again after the merge.
on:
  pull_request:
    branches: [main]

# Avoid paying for obsolete commits when a PR is updated.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  deployment-check:
    name: validate deploy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
      - name: Validate deployment and path routing
        run: bash scripts/tests/deployment-static.test.sh
      - name: Docker Compose production configuration
        env:
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
        run: docker compose -f docker-compose.yml config --quiet

  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
      qodana: ${{ steps.filter.outputs.qodana }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: scripts
      - name: Classify changes introduced by the PR
        id: filter
        run: |
          set -euo pipefail
          # PR's synthetic merge commit has the target main tip as first parent.
          # --no-renames ensures a moved file checks both its old and new areas.
          git diff --name-only --no-renames -z HEAD^1 HEAD | python3 scripts/ci-path-filter.py --stdin-z

  test:
    name: Backend tests and WAR
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gradle
            scripts
            src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java tests and production WAR in one Gradle invocation
        run: ./gradlew test bootWar --no-daemon --stacktrace --parallel
      - name: Summarize failed SQL tests
        if: failure()
        run: grep -n -A 10 -B 2 -E 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test/*.xml || true
      # Server-generated HTML fixtures are produced by the Java test above.
      # Run cross-layer browser tests only when this PR touches BOTH areas.
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.integration == 'true'
        with:
          node-version: '20'
          cache: npm
      - name: Browser integration tests (server-rendered HTML fixtures)
        if: needs.changes.outputs.integration == 'true'
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          set -euo pipefail
          test -f build/profile-missing-preview.html
          test -f build/objekt-modal-preview.html
          npm install --prefix /tmp/objekt-browser --no-package-lock --prefer-offline playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-account-ui.browser.cjs
          node scripts/tests/objekt-modal.browser.cjs
          node scripts/tests/profile-board.browser.cjs
          node scripts/tests/chemistry-search-link.browser.cjs
          node scripts/tests/objekt-mobile.browser.cjs
          node scripts/tests/site-header.browser.cjs
          node scripts/tests/objekt-artist-gravity.browser.cjs
          node scripts/tests/objekt-season-schedule.browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure() && needs.changes.outputs.integration == 'true'
        with:
          name: integration-browser-failure-screenshots
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore


  browser:
    name: Frontend CSS, JS and browser tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gradle
            scripts
            src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: CSS reproducibility and bundle checks
        run: ./scripts/setup-css.sh --check
      - name: JavaScript unit tests
        run: node --test scripts/tests/*.test.cjs

      - name: Browser tests without Java-generated fixtures
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          set -euo pipefail
          npm install --prefix /tmp/objekt-browser --no-package-lock --prefer-offline playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-detail-mobile-open.browser.cjs
          node scripts/tests/objekt-desc-leading.browser.cjs
          node scripts/tests/objekt-member-selection.browser.cjs
          node scripts/tests/objekt-live-filters.browser.cjs
          node scripts/tests/objekt-live.browser.cjs
          node scripts/tests/objekt-card-chrome.browser.cjs
          node scripts/tests/collection-live-filters.browser.cjs
          node scripts/tests/collection-dropdown-layout.browser.cjs
          node scripts/tests/archive-layout.browser.cjs
          node scripts/tests/archive-history.browser.cjs
          node scripts/tests/archive-live-state.browser.cjs
          node scripts/tests/archive-folder-home.browser.cjs
          node scripts/tests/archive-detail-ui.browser.cjs
          node scripts/tests/archive-manage-preview.browser.cjs
          node scripts/tests/archive-carousel.browser.cjs
          node scripts/tests/modal-navigation.browser.cjs
          node scripts/tests/date-calendar-scope.cjs
          node scripts/tests/objekt-grid-cols.browser.cjs
          node scripts/tests/profile-ownership-tabs.browser.cjs
          node scripts/tests/scroll-top.browser.cjs
          node scripts/tests/site-header-mobile.browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failure-screenshots
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore

  qodana:
    needs: changes
    if: needs.changes.outputs.qodana == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Qodana CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="/tmp/qodana.tar.gz"
          asset="https://api.github.com/repos/JetBrains/qodana-cli/releases/assets/585558698"
          ok=0
          for i in 1 2 3; do
            if curl -fL --connect-timeout 15 --max-time 60 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "$archive" "$asset" \
               && echo "b1fc01fb5825f4c6382f9cedcfe97d4a8eeaaddc9f5384a3b5870ca63e231c6f  $archive" | sha256sum -c -; then
              ok=1
              break
            fi
            echo "Qodana CLI download failed (attempt $i), retrying..."
            if [[ "$i" -lt 3 ]]; then sleep $((i * 8)); fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::Could not download and verify the Qodana CLI"
            exit 1
          fi
          sudo tar -xzf "$archive" -C /usr/local/bin
          qodana --version
      - name: Qodana Scan
        id: scan
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          use-installed-cli: true
          pr-mode: true
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
          results-dir: ${{ runner.temp }}/qodana/results
      - name: Retry Qodana Scan
        id: scan_retry
        if: steps.scan.outcome == 'failure'
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          use-installed-cli: true
          pr-mode: true
          use-caches: false
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          artifact-name: qodana-report-retry
          push-fixes: 'none'
          results-dir: ${{ runner.temp }}/qodana/retry-results
      - name: Honor Qodana result
        env:
          SCAN: ${{ steps.scan.outcome }}
          RETRY: ${{ steps.scan_retry.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SCAN" == "success" || "$RETRY" == "success" ]]; then
            echo "Qodana scan succeeded."
            exit 0
          fi
          echo "::error::Qodana did not complete successfully after retry. See the scan steps and reports."
          exit 1

  required:
    name: required
    if: ${{ always() }}
    needs: [changes, deployment-check, test, browser, qodana]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selective CI merge gate
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          INTEGRATION: ${{ needs.changes.outputs.integration }}
          QODANA: ${{ needs.changes.outputs.qodana }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FRONTEND_RESULT: ${{ needs.browser.result }}
          QODANA_RESULT: ${{ needs.qodana.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" && "$DEPLOYMENT_RESULT" == "success" ]] || {
            echo "::error::Routing or deployment validation failed"
            exit 1
          }
          for flag in "$BACKEND" "$FRONTEND" "$INTEGRATION" "$QODANA"; do
            [[ "$flag" == "true" || "$flag" == "false" ]] || {
              echo "::error::Missing or invalid change routing output: $flag"
              exit 1
            }
          done
          [[ "$INTEGRATION" == "false" || ( "$BACKEND" == "true" && "$FRONTEND" == "true" ) ]] || exit 1
          [[ "$QODANA" == "$BACKEND" ]] || exit 1

          require_result() {
            local area="$1" enabled="$2" actual="$3" expected="skipped"
            [[ "$enabled" == "true" ]] && expected="success"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$area expected=$expected actual=$actual enabled=$enabled"
              exit 1
            fi
            echo "$area=$actual ($enabled)"
          }
          require_result "Backend/Gradle" "$BACKEND" "$TEST_RESULT"
          require_result "Frontend/JS" "$FRONTEND" "$FRONTEND_RESULT"
          require_result "Qodana" "$QODANA" "$QODANA_RESULT"
          echo "Selective PR checks passed"
