name: CI tests

# Run full checks only on PRs targeting main, not again after the merge.
on:
  pull_request:
    branches: [main]

# Avoid paying for obsolete commits when a PR is updated.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  deployment-check:
    name: validate deploy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash and deployment assertions
        run: bash scripts/tests/deployment-static.test.sh
      - name: Docker Compose production configuration
        env:
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
        run: docker compose -f docker-compose.yml config --quiet

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        name: Decide whether app checks are needed
        run: |
          set -euo pipefail
          # pull_request checkout은 가상의 merge commit; 첫 부모가 main입니다.
          mapfile -t files < <(git diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed files:\n'
          printf '  %s\n' "${files[@]:-}"

          app=false
          for f in "${files[@]:-}"; do
            # App/test code still needs the full suite.
            if [[ "$f" == scripts/tests/* ]]; then
              app=true
              break
            fi
            # Docs, deploy/CI scripts, editor/meta files can skip heavy checks.
            case "$f" in
              package.json|package-lock.json|scripts/setup-css.sh|scripts/build-*-css.cjs|scripts/build-css.cjs|scripts/build-tw4.cjs|scripts/check-css-drift.cjs|scripts/tailwind*.cjs|scripts/css/*)
                app=true
                break
                ;;
              *.md|docs/*|.github/*|.githooks/*|.cursor/*|.vscode/*|.gitignore|.gitattributes|.dockerignore|.env.example|LICENSE*|scripts/*)
                ;;
              *)
                app=true
                break
                ;;
            esac
          done

          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [[ "$app" == "true" ]]; then
            echo "App-related paths changed — running full checks."
          else
            echo "Docs/scripts/meta only — skipping test, package, and qodana."
          fi


  test:
    name: Java tests and WAR
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java tests and production WAR in one Gradle invocation
        run: ./gradlew test bootWar --no-daemon --stacktrace --parallel
      - name: Summarize failed SQL tests
        if: failure()
        run: grep -n -A 10 -B 2 -E 'BadSqlGrammarException|JdbcSQLSyntaxErrorException' build/test-results/test/*.xml || true
      # 이 브라우저 테스트는 Java MockMvc 테스트에서 생성하는 HTML fixture를 사용한다.
      # 생성물은 같은 runner의 build/ 아래에 있으므로 별도 워크플로 artifact가 불필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify generated profile HTML in Chrome
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          test -f build/profile-missing-preview.html
          npm install --prefix /tmp/objekt-browser --no-package-lock --prefer-offline playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-account-ui.browser.cjs


  browser:
    name: CSS and browser tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: CSS reproducibility and bundle checks
        run: ./scripts/setup-css.sh --check
      - name: JavaScript unit tests
        run: node scripts/tests/objekt-detail.test.cjs && node scripts/tests/objekt-transfers.test.cjs && node scripts/tests/objekt-kind-combo.test.cjs
      - name: Chrome UI regression suite
        env:
          NODE_PATH: /tmp/objekt-browser/node_modules
        run: |
          npm install --prefix /tmp/objekt-browser --no-package-lock --prefer-offline playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then
            export CHROMIUM_PATH=/usr/bin/google-chrome
          else
            /tmp/objekt-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
          node scripts/tests/objekt-modal.browser.cjs
          node scripts/tests/objekt-detail-mobile-open.browser.cjs
          node scripts/tests/objekt-desc-leading.browser.cjs
          node scripts/tests/profile-board.browser.cjs
          node scripts/tests/chemistry-search-link.browser.cjs
          node scripts/tests/objekt-mobile.browser.cjs
          node scripts/tests/site-header.browser.cjs
          node scripts/tests/objekt-artist-gravity.browser.cjs
          node scripts/tests/objekt-member-selection.browser.cjs
          node scripts/tests/objekt-live-filters.browser.cjs
          node scripts/tests/objekt-live.browser.cjs
          node scripts/tests/objekt-card-chrome.browser.cjs
          node scripts/tests/collection-live-filters.browser.cjs
          node scripts/tests/collection-dropdown-layout.browser.cjs
          node scripts/tests/archive-layout.browser.cjs
          node scripts/tests/archive-history.browser.cjs
          node scripts/tests/archive-folder-home.browser.cjs
          node scripts/tests/archive-detail-ui.browser.cjs
          node scripts/tests/archive-manage-preview.browser.cjs
          node scripts/tests/archive-carousel.browser.cjs
          node scripts/tests/modal-navigation.browser.cjs
          node scripts/tests/date-calendar-scope.cjs
          node scripts/tests/objekt-grid-cols.browser.cjs
          node scripts/tests/profile-ownership-tabs.browser.cjs
          node scripts/tests/objekt-season-schedule.browser.cjs
          node scripts/tests/scroll-top.browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: objekt-browser-failure-screenshots
          path: /tmp/objekt-ui/*.png
          if-no-files-found: ignore

  qodana:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Qodana CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          archive="/tmp/qodana.tar.gz"
          asset="https://api.github.com/repos/JetBrains/qodana-cli/releases/assets/585558698"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --max-time 180 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "$archive" "$asset" \
               && echo "b1fc01fb5825f4c6382f9cedcfe97d4a8eeaaddc9f5384a3b5870ca63e231c6f  $archive" | sha256sum -c -; then
              ok=1
              break
            fi
            echo "Qodana CLI download failed (attempt $i), retrying..."
            sleep $((i * 8))
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::warning::GitHub Releases 504/timeout — Qodana scan skipped so required is not blocked by infrastructure."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo tar -xzf "$archive" -C /usr/local/bin
          qodana --version
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: Qodana Scan
        id: scan
        if: steps.cli.outputs.skipped != 'true'
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          use-installed-cli: true
          pr-mode: true
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
          results-dir: ${{ runner.temp }}/qodana/results
      - name: Retry Qodana Scan
        id: scan_retry
        if: steps.cli.outputs.skipped != 'true' && steps.scan.outcome == 'failure'
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2
        with:
          use-installed-cli: true
          pr-mode: true
          use-caches: false
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          artifact-name: qodana-report-retry
          push-fixes: 'none'
          results-dir: ${{ runner.temp }}/qodana/results
      - name: Honor Qodana result
        if: steps.cli.outputs.skipped != 'true'
        env:
          SCAN: ${{ steps.scan.outcome }}
          RETRY: ${{ steps.scan_retry.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SCAN" == "success" || "$RETRY" == "success" ]]; then
            echo "Qodana scan succeeded."
            exit 0
          fi
          sarif="${{ runner.temp }}/qodana/results/qodana.sarif.json"
          if [[ -f "$sarif" ]]; then
            python3 - "$sarif" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          findings = []
          for run in data.get("runs") or []:
              findings.extend(run.get("results") or [])
          if findings:
              print(f"Qodana reported {len(findings)} finding(s).", file=sys.stderr)
              sys.exit(1)
          print("SARIF has no findings.")
          PY
          fi
          echo "::warning::Qodana scan failed without findings — skipping so required is not blocked by scanner infrastructure."

  required:
    name: required
    if: ${{ always() }}
    needs: [changes, deployment-check, test, browser, qodana]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce merge gate
        env:
          APP: ${{ needs.changes.outputs.app }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          QODANA_RESULT: ${{ needs.qodana.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" || "$DEPLOYMENT_RESULT" != "success" ]]; then
            echo "Change detection or deployment configuration validation failed."
            exit 1
          fi
          if [[ "$APP" != "true" ]]; then
            echo "Non-app PR — Java, browser and Qodana jobs intentionally skipped."
            exit 0
          fi
          [[ "$TEST_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$QODANA_RESULT" == "success" ]] || exit 1
