name: PR Tailscale preview

'on':
  workflow_call:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

jobs:
  preview:
    # Code from a fork must never receive Pi credentials or production snapshots.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check current PR state
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const closing = context.payload.action === 'closed';
            const current = closing ? pr.data.state === 'closed' :
              pr.data.state === 'open' && pr.data.head.sha === context.payload.pull_request.head.sha;
            core.setOutput('run', String(current));
            core.setOutput('closing', String(closing));

      - name: Checkout
        if: steps.current.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.current.outputs.closing == 'true' && github.event.pull_request.head.sha || github.sha }}

      - name: Compute image name
        if: steps.current.outputs.run == 'true' && steps.current.outputs.closing == 'false'
        id: image
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "name=ghcr.io/${REPO,,}:pr-${PR}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.current.outputs.run == 'true' && steps.current.outputs.closing == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.current.outputs.run == 'true' && steps.current.outputs.closing == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR image
        if: steps.current.outputs.run == 'true' && steps.current.outputs.closing == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Check PR again after build
        if: steps.current.outputs.run == 'true'
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const closing = context.payload.action === 'closed';
            core.setOutput('run', String(closing ? pr.data.state === 'closed' :
              pr.data.state === 'open' && pr.data.head.sha === context.payload.pull_request.head.sha));

      - name: Connect Tailscale
        if: steps.latest.outputs.run == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PI_HOST }}

      - name: Prepare SSH
        if: steps.latest.outputs.run == 'true'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          printf 'Host pi\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/preview_key\n  StrictHostKeyChecking accept-new\n' "$PI_HOST" "$PI_USER" >> ~/.ssh/config

      - name: Deploy or clean up
        if: steps.latest.outputs.run == 'true'
        id: deploy
        env:
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CLOSING: ${{ steps.current.outputs.closing }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PI_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$PI_DEPLOY_PATH" != *..* ]]
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$CLOSING" == true ]]; then
            ssh pi bash -s -- cleanup "$PI_DEPLOY_PATH" "$PR" < scripts/preview-pi.sh > result.json
          else
            # A private Docker config avoids changing the production registry login.
            config=$(ssh pi 'mktemp -d /tmp/triples-preview-registry.XXXXXXXX')
            [[ "$config" =~ ^/tmp/triples-preview-registry\.[a-zA-Z0-9]+$ ]]
            trap 'ssh pi rm -rf -- "$config" || true' EXIT
            printf '%s' "$GHCR_TOKEN" | ssh pi docker --config "$config" login ghcr.io -u "$GHCR_USER" --password-stdin >&2
            ssh pi env DOCKER_CONFIG="$config" bash -s -- deploy "$PI_DEPLOY_PATH" "$PR" "$IMAGE" "$SHA" < scripts/preview-pi.sh > result.json
          fi
          echo "result=$(jq -c . result.json)" >> "$GITHUB_OUTPUT"

      - name: Update preview comment
        if: always() && steps.current.outputs.run == 'true' && (steps.latest.outputs.run == 'true' || failure())
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          CLOSING: ${{ steps.current.outputs.closing }}
          FAILED: ${{ job.status == 'failure' }}
        with:
          script: |
            const marker = '<!-- triplesweb-preview -->';
            let body;
            if (process.env.FAILED === 'true' || !process.env.RESULT) {
              body = '미리보기 배포 또는 정리에 실패했습니다. 기존 미리보기의 상태와 Actions 실행 로그를 확인해 주세요.';
            } else {
              const result = JSON.parse(process.env.RESULT);
              body = result.status === 'cleaned' ? 'PR이 종료되어 미리보기를 정리했습니다.' :
                `📱 **모바일 미리보기:** ${result.url}\n\n커밋: \`${result.sha}\`\n운영 DB 복사 시각: ${result.snapshotAt}\n\n휴대폰을 같은 Tailscale 네트워크에 연결해 주세요. 미리보기에서 수정한 데이터는 운영에 반영되지 않습니다.`;
            }
            body = `${marker}\n${body}\n\n[Actions 실행 보기](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
