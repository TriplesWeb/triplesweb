plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-tomcat'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.jsoup:jsoup:1.23.2'
	// 로컬 bootRun만 — Java 저장 후 컴파일되면 컨텍스트 자동 재시작 (war/Docker에는 미포함)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mustache-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'net.coobird:thumbnailator:0.4.19'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.3"
	}
}

war {
	archiveFileName = 'triples.war'
}

tasks.named('bootWar') {
	archiveFileName = 'triples.war'
	// Docker/CI에서 -x test 로 건너뛸 수 있음. 로컬 bootWar는 검사 후 패키징.
	dependsOn test
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('javadoc', Javadoc) {
	options.encoding = 'UTF-8'
	options.docEncoding = 'UTF-8'
	options.charSet = 'UTF-8'
}

// Uses the same server-only credentials as Gravity; no tokens in command arguments.
tasks.register('importCosmoObjekts', JavaExec) {
	group = 'application'
	description = 'Import the connected COSMO account into its own DB snapshot tables.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.triplesweb.service.CosmoObjektImportCommand'
	jvmArgs '-Dspring.devtools.restart.enabled=false'
}

// .env는 Spring 시작 단계에서 읽으므로 IntelliJ의 메인 클래스 실행에도 적용된다.
tasks.named('bootRun') {
	systemProperty 'spring.profiles.default', 'local'
}
