plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	//runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
	implementation 'net.coobird:thumbnailator:0.4.19'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'

}
dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.0"
	}
}
war {
	archiveFileName = 'triples.war'
}

tasks.named('bootWar') {
	archiveFileName = 'triples.war'
}


tasks.named('test') {
	useJUnitPlatform()
}

// Load .env into bootRun so local ./gradlew bootRun needs no manual export
tasks.named('bootRun') {
	def envFile = rootProject.file('.env')
	if (!envFile.exists()) {
		return
	}
	def loaded = [:]
	envFile.eachLine { line ->
		def trimmed = line.trim()
		if (!trimmed || trimmed.startsWith('#')) {
			return
		}
		def idx = trimmed.indexOf('=')
		if (idx < 1) {
			return
		}
		def key = trimmed.substring(0, idx).trim()
		def value = trimmed.substring(idx + 1).trim()
		if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
			value = value.substring(1, value.length() - 1)
		}
		loaded[key] = value
		environment key, value
	}
	// Docker .env uses MYSQL_*; map to Spring datasource vars
	if (loaded.MYSQL_PASSWORD && !loaded.SPRING_DATASOURCE_PASSWORD) {
		environment 'SPRING_DATASOURCE_PASSWORD', loaded.MYSQL_PASSWORD
	}
	if (loaded.MYSQL_USER && !loaded.SPRING_DATASOURCE_USERNAME) {
		environment 'SPRING_DATASOURCE_USERNAME', loaded.MYSQL_USER
	}
	if (loaded.MYSQL_DATABASE && !loaded.SPRING_DATASOURCE_URL) {
		def host = loaded.MYSQL_HOST ?: 'localhost'
		def port = loaded.MYSQL_PORT ?: '3306'
		environment 'SPRING_DATASOURCE_URL',
				"jdbc:mariadb://${host}:${port}/${loaded.MYSQL_DATABASE}?useSSL=false"
	}
}
