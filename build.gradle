plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.jsoup:jsoup:1.18.3'
	// 로컬 bootRun만 — Java 저장 후 컴파일되면 컨텍스트 자동 재시작 (war/Docker에는 미포함)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
	implementation 'net.coobird:thumbnailator:0.4.19'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-mustache'

}
dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.0"
	}
}
war {
	archiveFileName = 'triples.war'
}

tasks.named('bootWar') {
	archiveFileName = 'triples.war'
	// Docker/CI에서 -x test 로 건너뛸 수 있음. 로컬 bootWar는 검사 후 패키징.
	dependsOn test
}


tasks.named('test') {
	useJUnitPlatform()
}

// Uses the same server-only credentials as Gravity; no tokens in command arguments.
tasks.register('importCosmoObjekts', JavaExec) {
    group = 'application'
    description = 'Import the connected COSMO account into its own DB snapshot tables.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.triplesweb.service.CosmoObjektImportCommand'
    jvmArgs '-Dspring.devtools.restart.enabled=false'
}

// .env는 Spring 시작 단계에서 읽으므로 IntelliJ의 메인 클래스 실행에도 적용된다.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.default', 'local'
}
