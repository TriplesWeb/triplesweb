services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-triples}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      # Tailscale(100.x)에서 local bootRun 접속용
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ${MARIADB_TUNING_CNF:-./docker/mariadb/empty.cnf}:/etc/mysql/conf.d/tuning.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - triples

  app:
    image: ${IMAGE:-ghcr.io/triplesweb/triplesweb:latest}
    mem_limit: ${APP_MEMORY_LIMIT:-1800m}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      SERVER_PORT: "8080"
      LOGGING_FILE_NAME: /app/logs/triplesweb.log
      LOGGING_LOGBACK_ROLLINGPOLICY_FILENAMEPATTERN: '/app/logs/triplesweb.log.%d{yyyy-MM-dd}.%i.gz'
      LOGGING_LOGBACK_ROLLINGPOLICY_MAXHISTORY: "30"
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTALSIZECAP: 1GB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAXFILESIZE: 10MB
      LOGGING_LOGBACK_ROLLINGPOLICY_CLEANHISTORYONSTART: "true"
      SPRING_DATASOURCE_URL: jdbc:mariadb://${MYSQL_HOST:-mariadb}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-triples}?useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      COSMO_ACCESS_TOKEN: ${COSMO_ACCESS_TOKEN:-}
      COSMO_REFRESH_TOKEN: ${COSMO_REFRESH_TOKEN:-}
      COSMO_KEY: ${COSMO_KEY:-}
      COSMO_CREDENTIALS_FILE: /app/data/cosmo/credentials.json
      OBJEKT_MINT_CHAIN_ENABLED: ${OBJEKT_MINT_CHAIN_ENABLED:-false}
      OBJEKT_MINT_CHAIN_ID: ${OBJEKT_MINT_CHAIN_ID:-2741}
      OBJEKT_MINT_RPC_URL: ${OBJEKT_MINT_RPC_URL:-https://api.mainnet.abs.xyz}
      OBJEKT_MINT_CONTRACT: ${OBJEKT_MINT_CONTRACT:-0x99Bb83AE9bb0C0A6be865CaCF67760947f91Cb70}
      OBJEKT_MINT_SPIN_ADDRESS: ${OBJEKT_MINT_SPIN_ADDRESS:-0xd3d5f29881ad87bb10c1100e2c709c9596de345f}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CHEMISTRY_ADMIN_PASSWORD: ${CHEMISTRY_ADMIN_PASSWORD:-}
      FILE_UPLOAD_DIR: /app/uploads
      MEDIA_CATALOG_PATH: /app/data/videos.json
      # 서버는 uploads 마운트가 곧 원본 — 자기 자신으로 SSH sync/폴백하지 않음
      UPLOAD_SYNC_ENABLED: "false"
      UPLOAD_FALLBACK_BASE_URL: ""
    volumes:
      # 원본 uploads는 HDD(/mnt/data)에 둔다. 인프라 이전(2026-11-26) 후 경로.
      - /mnt/data/triplesweb/uploads:/app/uploads
      - ./uploads-thumbs:/app/uploads/thumbs # 썸네일은 SSD에 따로 둔다
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - triples

volumes:
  mariadb_data:

networks:
  triples:
    driver: bridge
