services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-triples}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      # Tailscale(100.x)에서 local bootRun 접속용
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - triples

  app:
    image: ${IMAGE:-ghcr.io/triplesweb/triplesweb:latest}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mariadb://${MYSQL_HOST:-mariadb}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-triples}?useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      COSMO_ACCESS_TOKEN: ${COSMO_ACCESS_TOKEN:-}
      COSMO_REFRESH_TOKEN: ${COSMO_REFRESH_TOKEN:-}
      COSMO_KEY: ${COSMO_KEY:-}
      COSMO_CREDENTIALS_FILE: /app/data/cosmo/credentials.json
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CHEMISTRY_ADMIN_PASSWORD: ${CHEMISTRY_ADMIN_PASSWORD:-}
      FILE_UPLOAD_DIR: /app/uploads
      MEDIA_CATALOG_PATH: /app/data/videos.json
      # 서버는 uploads 마운트가 곧 원본 — 자기 자신으로 SSH sync/폴백하지 않음
      UPLOAD_SYNC_ENABLED: "false"
      UPLOAD_FALLBACK_BASE_URL: ""
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - triples

volumes:
  mariadb_data:

networks:
  triples:
    driver: bridge
